[project]
name = "unreal-source-mcp"
version = "0.1.0"
description = "SQLite FTS5 (trigram) MCP server for Unreal Engine source code search."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "pydantic>=2.0",
]

[project.scripts]
unreal-source-mcp = "unreal_source_mcp.server:main"
unreal-source-build-db = "unreal_source_mcp.build_db:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]
