[project]
name = "code-explore-by-sql"
version = "0.1.0"
description = "SQLite FTS5 (trigram) MCP server for code source search."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "pydantic>=2.0",
]

[project.scripts]
code-explore-by-sql = "code_explore_by_sql.server:main"
code-explore-by-sql-build-db = "code_explore_by_sql.build_db:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]
